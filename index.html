<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فلوسي — مدير فلوسك الذكي</title>
<meta name="theme-color" content="#080b1a">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="فلوسي">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============ الألوان والمتغيرات ============ */
:root{
  --bg1:#070a18;--bg2:#10163a;--card:rgba(255,255,255,.055);--card2:rgba(255,255,255,.1);
  --stroke:rgba(255,255,255,.12);--txt:#eef1ff;--mut:#9aa4cc;--track:rgba(255,255,255,.1);
  --acc:#8b6cff;--acc2:#22d3ee;--green:#2ee6a6;--red:#ff5d7a;--gold:#ffc857;--blue:#4da3ff;--orange:#ff9f5a;
  --shadow:0 20px 60px rgba(0,0,0,.35);--modal:linear-gradient(160deg,#1c2352,#0f1330);
  color-scheme:dark;
}
:root[data-theme=light]{
  --bg1:#eef1ff;--bg2:#dfe6ff;--card:rgba(255,255,255,.72);--card2:rgba(255,255,255,.95);
  --stroke:rgba(80,90,160,.16);--txt:#1a2048;--mut:#5d6798;--track:rgba(60,70,140,.12);
  --shadow:0 18px 50px rgba(70,80,160,.16);--modal:linear-gradient(160deg,#ffffff,#eef1ff);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Tajawal','Segoe UI',Tahoma,system-ui,sans-serif;color:var(--txt);min-height:100vh;
  background:radial-gradient(1200px 800px at 80% -10%,var(--bg2),transparent 60%),var(--bg1);
  overflow-x:hidden;line-height:1.6}
#bg,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#bg{z-index:0}#fx{z-index:90}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;width:100%;background:rgba(255,255,255,.06);border:1px solid var(--stroke);color:var(--txt);
  border-radius:14px;padding:12px 14px;outline:0;transition:border-color .2s,box-shadow .2s}
:root[data-theme=light] input,:root[data-theme=light] select{background:rgba(255,255,255,.8)}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 4px rgba(139,108,255,.18)}
option{color:#111}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--stroke);border-radius:9px}

/* ============ الهيكل ============ */
.app{position:relative;z-index:1;display:grid;grid-template-columns:262px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:22px 16px;display:flex;flex-direction:column;gap:18px;
  border-left:1px solid var(--stroke);background:var(--card);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.logo{display:flex;align-items:center;gap:12px;padding:6px 8px}
.logo .lg{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:26px;
  background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 8px 28px rgba(139,108,255,.5);animation:float 3.5s ease-in-out infinite}
.logo b{font-size:26px;font-weight:900;background:linear-gradient(90deg,var(--acc),var(--acc2),var(--green),var(--acc));
  background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite;display:block;line-height:1.2}
.logo small{color:var(--mut);font-size:12px}
#nav{display:flex;flex-direction:column;gap:6px}
#nav button{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;color:var(--mut);font-weight:700;
  transition:.25s;position:relative;text-align:right}
#nav button .ni{font-size:20px;transition:transform .3s}
#nav button:hover{background:var(--card2);color:var(--txt)}
#nav button:hover .ni{transform:scale(1.25) rotate(-8deg)}
#nav button.on{color:#fff;background:linear-gradient(135deg,rgba(139,108,255,.9),rgba(34,211,238,.75));box-shadow:0 10px 28px rgba(139,108,255,.4)}
.quote{margin-top:auto;padding:16px;border-radius:18px;border:1px dashed var(--stroke);color:var(--mut);font-size:13px;min-height:84px;
  display:grid;place-items:center;text-align:center;transition:opacity .5s}
main{padding:26px clamp(14px,3vw,36px) 60px;min-width:0}

/* ============ الشريط العلوي ============ */
.tb{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center;margin-bottom:22px}
.tb h1{font-size:clamp(22px,3vw,32px);font-weight:900}
.tb p{color:var(--mut);font-size:14px}
.tb-a{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.mnav{display:flex;align-items:center;background:var(--card);border:1px solid var(--stroke);border-radius:16px;padding:4px;backdrop-filter:blur(14px)}
.mnav button{width:38px;height:38px;border-radius:12px;font-size:18px;transition:.2s}
.mnav button:hover{background:var(--card2);transform:scale(1.1)}
.mnav select{border:0;background:transparent;width:auto;font-weight:800;padding:8px 6px;text-align:center;cursor:pointer}
.chip{padding:8px 12px;border-radius:99px;font-size:12px;font-weight:700;background:var(--card);border:1px solid var(--stroke)}
.chip.cloud{color:var(--green)}.chip.local{color:var(--gold)}

/* ============ البطاقات والأزرار ============ */
.card{position:relative;background:var(--card);border:1px solid var(--stroke);border-radius:24px;padding:20px;
  backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);box-shadow:var(--shadow);
  transition:transform .25s ease,border-color .25s;overflow:hidden;animation:rise .7s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*70ms)}
.card::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(420px circle at var(--mx,50%) var(--my,0%),rgba(139,108,255,.2),transparent 45%)}
.card:hover::before{opacity:1}.card:hover{border-color:rgba(139,108,255,.45)}
.card h3{font-size:17px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.grid{display:grid;gap:16px;margin-bottom:16px}
.stats{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.g21{grid-template-columns:1.2fr 1fr}
.btn{position:relative;overflow:hidden;border-radius:14px;padding:10px 16px;font-weight:800;background:var(--card2);
  border:1px solid var(--stroke);transition:.25s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.2)}
.btn:active{transform:scale(.96)}
.btn.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:0;box-shadow:0 10px 26px rgba(139,108,255,.4)}
.btn.red{background:rgba(255,93,122,.15);color:var(--red);border-color:rgba(255,93,122,.35)}
.btn.ic{width:44px;padding:10px}.btn.wide{width:100%;padding:14px;font-size:16px;margin-top:14px}.btn.sm{padding:6px 12px;font-size:13px;border-radius:11px}
.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.4);transform:scale(0);animation:rp .6s linear;pointer-events:none}
.fab{position:fixed;z-index:30;left:26px;bottom:26px;width:66px;height:66px;border-radius:50%;font-size:34px;color:#fff;font-weight:300;
  background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 14px 40px rgba(139,108,255,.6);transition:transform .3s;display:grid;place-items:center}
.fab::after{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid var(--acc2);animation:pulse 2.2s infinite}
.fab:hover{transform:scale(1.12) rotate(90deg)}

/* ============ إحصائيات ============ */
.stat{display:flex;flex-direction:column;gap:6px}
.stat .si{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:color-mix(in srgb,var(--c) 22%,transparent);margin-bottom:4px}
.stat span{color:var(--mut);font-size:13px;font-weight:700}
.stat .v{font-size:clamp(22px,2.4vw,30px);font-weight:900;color:var(--c);display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.stat .v small{font-size:13px;color:var(--mut);font-weight:700}
.stat em{font-style:normal;font-size:12px;color:var(--mut)}
.hero{background:linear-gradient(135deg,rgba(139,108,255,.35),rgba(34,211,238,.2));border-color:rgba(139,108,255,.4)}

/* ============ المعاملات ============ */
.tx{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;transition:.2s;animation:rise .5s backwards}
.tx:hover{background:var(--card2);transform:translateX(-4px)}
.tx .ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:22px;flex:none;background:color-mix(in srgb,var(--c) 20%,transparent)}
.tx-m{flex:1;min-width:0}.tx-m b{display:block;font-weight:800}
.tx-m small{color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:900;white-space:nowrap}
.tx-a{display:flex;gap:2px;opacity:.25;transition:.2s}.tx:hover .tx-a{opacity:1}
.tx-a button{width:34px;height:34px;border-radius:10px}.tx-a button:hover{background:var(--card2)}
.dayh{color:var(--mut);font-size:13px;font-weight:800;padding:14px 6px 4px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.fc{padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--stroke);font-weight:700;font-size:13px;transition:.2s}
.fc:hover{transform:translateY(-2px)}.fc.on{background:var(--acc);color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(139,108,255,.4)}
.empty{text-align:center;padding:36px 10px;color:var(--mut)}.empty .e{font-size:54px;display:block;animation:float 3s ease-in-out infinite}

/* ============ الرسوم ============ */
.prog{height:10px;border-radius:99px;background:var(--track);overflow:hidden}
.prog b{display:block;height:100%;border-radius:99px;background:var(--c,var(--green));transform-origin:right center;animation:growX 1.1s cubic-bezier(.2,.8,.2,1) backwards}
.donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}
.donut svg{flex:none}.seg{animation:dash 1.2s cubic-bezier(.2,.8,.2,1) backwards}
.legend{flex:1;min-width:150px;display:flex;flex-direction:column;gap:8px}
.legend div{display:flex;align-items:center;gap:8px;font-size:13px}
.legend i{width:11px;height:11px;border-radius:4px;flex:none}.legend span{margin-right:auto;font-weight:800}
.bars{display:flex;align-items:flex-end;gap:3px;height:150px;padding-top:6px}
.bars>div{flex:1;height:100%;display:flex;align-items:flex-end;position:relative}
.bars i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,var(--acc),var(--acc2));transform-origin:bottom;
  animation:growY .9s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--k)*18ms);min-height:2px;transition:filter .2s}
.bars>div:hover i{filter:brightness(1.4)}
.bars>div:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#000c;color:#fff;font-size:11px;padding:3px 7px;border-radius:7px;white-space:nowrap;z-index:5}
.barlbl{display:flex;justify-content:space-between;color:var(--mut);font-size:11px;margin-top:6px}
.pair{display:flex;gap:3px;align-items:flex-end;width:100%;height:100%}.pair i{flex:1}
.ringbox{position:relative;display:grid;place-items:center}
.ringbox .rc{position:absolute;text-align:center}.rc b{font-size:34px;font-weight:900;display:block;line-height:1}.rc small{color:var(--mut);font-size:12px}
.tip{display:flex;gap:10px;padding:11px 13px;border-radius:14px;background:var(--card2);margin-bottom:8px;font-size:14px;animation:rise .5s backwards}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--stroke);font-size:14px}.kv:last-child{border:0}.kv b{font-weight:800}
.bud{cursor:pointer}.bud:hover{transform:translateY(-4px)}
.bud .top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.bud .top .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:21px;background:var(--card2)}
.bud .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:8px}
.badge{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:800;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c)}
.stack{display:flex;height:16px;border-radius:99px;overflow:hidden;gap:2px;margin:10px 0}.stack i{display:block;animation:growX 1s backwards;transform-origin:right}

/* ============ النوافذ ============ */
.ov{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:14px;background:rgba(4,6,18,.62);backdrop-filter:blur(7px);opacity:0;transition:opacity .25s}
.ov.show{opacity:1}
.md{position:relative;width:min(540px,100%);max-height:92vh;overflow:auto;background:var(--modal);border:1px solid var(--stroke);border-radius:28px;padding:26px;
  box-shadow:0 40px 100px rgba(0,0,0,.5);transform:translateY(40px) scale(.94);transition:transform .35s cubic-bezier(.2,.9,.3,1.25)}
.ov.show .md{transform:none}
.md h3{font-size:21px;font-weight:900;margin-bottom:16px;padding-left:36px}
.md .x{position:absolute;top:16px;left:16px;width:36px;height:36px;border-radius:50%;background:var(--card2);transition:.2s}.md .x:hover{transform:rotate(90deg) scale(1.1)}
.md p{color:var(--mut);margin-bottom:12px}
.md label{display:block;font-size:13px;font-weight:700;color:var(--mut);margin-bottom:10px}.md label input,.md label select{margin-top:6px;color:var(--txt)}
.lbl{font-size:13px;font-weight:700;color:var(--mut);margin:12px 0 8px}
.seg-types{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.st{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 2px;border-radius:14px;border:1.5px solid var(--stroke);font-size:20px;transition:.2s}
.st span{font-size:11px;font-weight:800;color:var(--mut)}.st:hover{transform:translateY(-3px)}
.st.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 22%,transparent);box-shadow:0 8px 22px color-mix(in srgb,var(--c) 40%,transparent)}.st.on span{color:var(--txt)}
.big{position:relative;margin:16px 0 0!important}.big input{font-size:34px;font-weight:900;text-align:center;padding:16px;border-radius:18px}
.big span{position:absolute;left:16px;top:50%;transform:translateY(-10%);color:var(--mut);font-size:14px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chp{padding:8px 12px;border-radius:12px;border:1.5px solid var(--stroke);font-weight:700;font-size:13px;transition:.2s}
.chp:hover{transform:translateY(-2px)}.chp.on{border-color:var(--acc);background:rgba(139,108,255,.25)}
.chk{display:flex!important;align-items:center;gap:10px;cursor:pointer;padding:10px 12px;border-radius:14px;background:var(--card2);color:var(--txt)!important;margin:10px 0 0!important}
.chk input{width:20px;height:20px;margin:0!important;accent-color:var(--acc)}
.shake{animation:shake .4s}
pre{direction:ltr;text-align:left;background:rgba(0,0,0,.35);color:#c8d0ff;padding:12px;border-radius:12px;font-size:12px;overflow:auto;margin-top:8px}

/* ============ التنبيهات ============ */
#toasts{position:fixed;z-index:80;bottom:26px;right:50%;transform:translateX(50%);display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{display:flex;gap:14px;align-items:center;padding:12px 18px;border-radius:16px;background:#151a3ef0;color:#fff;font-weight:700;box-shadow:0 14px 40px rgba(0,0,0,.4);
  border:1px solid rgba(255,255,255,.15);animation:pop .45s cubic-bezier(.2,.9,.3,1.3);transition:.4s}
.toast.out{opacity:0;transform:translateY(14px)}.toast button{color:var(--acc2);font-weight:900}

/* ============ الحركات ============ */
@keyframes rise{from{opacity:0;transform:translateY(28px) scale(.97)}}
@keyframes growX{from{transform:scaleX(0)}}@keyframes growY{from{transform:scaleY(0)}}
@keyframes dash{from{stroke-dasharray:0 999}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes shine{to{background-position:300% 0}}
@keyframes pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.6);opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.9)}}
@keyframes rp{to{transform:scale(4);opacity:0}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ============ تقسيمتي ============ */
.ck{width:34px;height:34px;border-radius:50%;border:2px solid var(--stroke);display:grid;place-items:center;flex:none;transition:.3s;color:transparent;font-size:17px;font-weight:900;background:transparent}
.ck:hover{border-color:var(--green);transform:scale(1.12)}
.ck.on{background:var(--green);border-color:var(--green);color:#06281d;box-shadow:0 0 0 6px rgba(46,230,166,.18);animation:tick .45s}
@keyframes tick{0%{transform:scale(.6)}60%{transform:scale(1.28)}100%{transform:scale(1)}}
.tx.done .tx-m b{text-decoration:line-through;opacity:.55}.tx.done .amt{opacity:.55}
input.mini{width:120px;flex:none;text-align:center;padding:9px 10px;font-weight:800}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:11px;font-weight:800;background:rgba(77,163,255,.2);color:var(--blue);margin-right:6px}
.scroll{max-height:380px;overflow:auto;padding-left:4px}
.next{outline:2px solid var(--acc);outline-offset:-2px;background:rgba(139,108,255,.1)}
.col{display:grid;gap:16px;align-content:start;min-width:0}
#view.still *:not(.ck){animation:none!important}

/* ============ شاشة الدخول ============ */
[hidden]{display:none!important}
body[data-auth="0"] .app,body[data-auth="0"] .fab{display:none}
#auth{position:fixed;inset:0;z-index:70;display:none;place-items:center;padding:16px;overflow:auto}
body[data-auth="0"] #auth{display:grid}
.ac{width:min(430px,100%);background:var(--card);border:1px solid var(--stroke);border-radius:30px;padding:30px 26px;backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);
  box-shadow:var(--shadow),0 0 90px rgba(139,108,255,.2);animation:rise .8s cubic-bezier(.2,.8,.2,1) backwards;text-align:center}
.alogo{width:78px;height:78px;margin:0 auto 12px;border-radius:26px;display:grid;place-items:center;font-size:42px;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 14px 44px rgba(139,108,255,.55);animation:float 3.5s ease-in-out infinite}
.ac h1{font-size:36px;font-weight:900;line-height:1.3;background:linear-gradient(90deg,var(--acc),var(--acc2),var(--green),var(--acc));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
.asub{color:var(--mut);font-size:14px;margin:2px 0 18px}
.atabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border-radius:16px;background:var(--card2);margin-bottom:16px}
.atabs button{padding:10px;border-radius:12px;font-weight:800;color:var(--mut);transition:.25s}
.atabs button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 8px 22px rgba(139,108,255,.4)}
.ac form{text-align:right}
.ac label{display:block;font-size:13px;font-weight:700;color:var(--mut);margin-bottom:12px}.ac label>input{margin-top:6px}
.ac input[dir=ltr]{text-align:left}
.pw{position:relative;display:block;margin-top:6px}.pw input{margin-top:0!important;padding-left:46px}
.eye{position:absolute;left:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:10px;font-size:17px;opacity:.7}.eye:hover{opacity:1;background:var(--card2)}
.aerr{min-height:20px;color:var(--red);font-size:13px;font-weight:700;text-align:right}.aerr.ok{color:var(--green)}
.alink{margin-top:14px;color:var(--acc2);font-weight:700;font-size:13px}
.adiv{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:12px;margin:16px 0}.adiv::before,.adiv::after{content:'';flex:1;height:1px;background:var(--stroke)}
.gbtn{background:#fff!important;color:#1f1f1f!important;border:0!important}.gbtn svg{width:20px;height:20px}
.aload{display:flex;flex-direction:column;align-items:center;gap:14px;padding:30px 0;color:var(--mut);font-weight:700}

  barq=p.subs.filter(x=>x.barq).reduce((a,x)=>a+x.amount,0)+p.allocs.filter(x=>(x.bank||'').includes('برق')).reduce((a,x)=>a+x.amount,0);
  const hasActual=pm.restActual>0;return{allocT,net,utilT,subT,debtD,rest,barq,salary:p.salary,hasActual,restUse:hasActual?pm.restActual:rest}}
function debtCalc(){const d=state.debt,paid=d.pay.filter(x=>x.paid).reduce((a,x)=>a+x.a,0);return{paid,left:Math.max(0,d.total-paid),pct:d.total>0?paid/d.total*100:0,next:d.pay.findIndex(x=>!x.paid)}}
function planKeys(){const p=state.plan,pm=getPM(cur);return['salary',...p.allocs.map(a=>'alloc:'+a.id),...p.utils.filter(u=>(pm.util[u.id]||0)>0).map(u=>'util:'+u.id),...p.subs.map(x=>'sub:'+x.id),...p.rest.map(r=>'rest:'+r.id)]}
function planItem(k){const p=state.plan,pm=getPM(cur),c=planCalc(),[t,id]=k.split(':'),KI=x=>KINDS[x]||KINDS.other;
  if(k==='salary')return{type:'income',cat:'راتب',amount:p.salary,note:'الراتب الإجمالي'};
  if(k==='xin')return{type:'income',cat:'أخرى',amount:pm.extra||0,note:'مبلغ إضافي'};
  if(t==='alloc'){const a=p.allocs.find(x=>x.id===id);if(!a)return null;const K=KI(a.kind);return{type:K.type,cat:K.cat,amount:a.amount,note:a.name+(a.bank&&a.bank!=='—'?' — '+a.bank:'')}}
  if(t==='util'){const u=p.utils.find(x=>x.id===id);if(!u)return null;return{type:'expense',cat:'فواتير',amount:pm.util[id]||0,note:u.name}}
  if(t==='sub'){const x=p.subs.find(y=>y.id===id);if(!x)return null;return{type:'expense',cat:'اشتراكات',amount:x.amount,note:x.name}}
  if(t==='rest'){const r=p.rest.find(x=>x.id===id);if(!r)return null;const K=KI(r.kind);return{type:K.type,cat:K.cat,amount:Math.max(0,c.restUse)*r.pct/100,note:r.name+' (توزيع الباقي)'}}
  if(t==='xs'){const r=p.xsplit.find(x=>x.id===id);if(!r)return null;const K=KI(r.kind);return{type:K.type,cat:K.cat,amount:(pm.extra||0)*r.pct/100,note:r.name+' (من المبلغ الإضافي)'}}
  if(t==='debt'){const pay=state.debt.pay[+id];if(!pay)return null;return{type:'debt',cat:'دين الوالدة',amount:pay.a,note:state.debt.name+' — قسط '+(+id+1)}}
  return null}
function removePlanTx(k){if(k.startsWith('debt:'))Object.values(state.months).forEach(m=>{m.tx=m.tx.filter(x=>x.planKey!==k)});else{const m=getM(cur);m.tx=m.tx.filter(x=>x.planKey!==k)}}
function togglePlan(k){const pm=getPM(cur),m=getM(cur),[t,id]=k.split(':'),isDebt=t==='debt',on=isDebt?state.debt.pay[+id].paid:!!pm.done[k];
  if(on){if(isDebt)state.debt.pay[+id].paid=false;else delete pm.done[k];removePlanTx(k);save();render(true);return}
  const it=planItem(k);if(!it||!(it.amount>0))return toast('حدد المبلغ أولاً 🙂');
  if(isDebt)state.debt.pay[+id].paid=true;else pm.done[k]=1;
  m.tx.push({id:uid(),type:it.type,cat:it.cat,amount:it.amount,date:defDate(),note:it.note,ts:Date.now(),planKey:k});
  save();render(true);toast(`✅ ${esc(it.note)} — ${money(it.amount)}`)}
function planUnmark(x,restore){if(!x.planKey)return;const k=x.planKey;if(k.startsWith('debt:')){const pay=state.debt.pay[+k.split(':')[1]];if(pay)pay.paid=restore}else{const pm=getPM(cur);if(restore)pm.done[k]=1;else delete pm.done[k]}}
function splitCard(){const pm=getPM(cur),keys=planKeys(),dn=keys.filter(k=>pm.done[k]).length,pc=keys.length?dn/keys.length*100:0,c=planCalc();
  return `<div class="card tilt" data-act="nav" data-v="split" style="cursor:pointer;margin-bottom:16px;display:flex;align-items:center;gap:18px;flex-wrap:wrap"><div class="ringbox">${ring(pc,'#22d3ee',84,10)}<div class="rc"><b style="font-size:18px">${dn}/${keys.length}</b></div></div><div style="flex:1;min-width:200px"><h3 style="margin-bottom:4px;justify-content:flex-start">🧮 تقسيمة ${mName(cur)}</h3><div style="color:var(--mut);font-size:14px">نفّذت ${dn} من ${keys.length} بند · الباقي نهاية الشهر المتوقع <b style="color:var(--green)">${money(c.rest)}</b></div></div><span class="btn">فتح التقسيمة ←</span></div>`}

/* ---------- رسوم ---------- */
function ring(pct,col,size=130,w=11){const r=52,c=2*Math.PI*r;
  return `<svg viewBox="0 0 120 120" width="${size}" height="${size}"><circle cx="60" cy="60" r="${r}" fill="none" style="stroke:var(--track)" stroke-width="${w}"/><circle class="seg" cx="60" cy="60" r="${r}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" style="stroke-dasharray:${c*Math.min(100,pct)/100} ${c}" transform="rotate(-90 60 60)"/></svg>`}
function donut(data,total){const r=70,c=2*Math.PI*r;let off=0;
  const segs=data.map(([,v,col])=>{const len=v/total*c;const s=`<circle class="seg" cx="90" cy="90" r="${r}" fill="none" stroke="${col}" stroke-width="24" style="stroke-dasharray:${Math.max(len-3,.5)} ${c}" stroke-dashoffset="${-off}" transform="rotate(-90 90 90)"/>`;off+=len;return s}).join('');
  return `<div class="ringbox"><svg viewBox="0 0 180 180" width="190" height="190"><circle cx="90" cy="90" r="${r}" fill="none" style="stroke:var(--track)" stroke-width="24"/>${segs}</svg><div class="rc"><b data-count="${total}">0</b><small>${state.settings.currency}</small></div></div>`}

function vPlan(){

  const rows=[['🏠','الاحتياجات','إيجار، فواتير، طعام، مواصلات، ديون',rule[0],g.needs,'#4da3ff',true],['🎮','الرغبات','تسوق، ترفيه، وغيرها',rule[1],g.wants,'#ff9f5a',true],['🌱','الادخار والاستثمار','مستقبلك المالي',rule[2],g.future,'#2ee6a6',false]];
  const keys=[];let k=cur;for(let i=0;i<6;i++){keys.unshift(k);k=prevKey(k)}
  const tr=keys.map(k=>({k,...totals(k)})),mx=Math.max(...tr.flatMap(x=>[x.income,x.expense]),1);
  const goalNeed=state.goals.filter(x=>x.saved<x.target&&x.deadline).reduce((a,x)=>{const d=new Date(x.deadline),n=new Date(),ml=Math.max(1,(d.getFullYear()-n.getFullYear())*12+d.getMonth()-n.getMonth());return a+(x.target-x.saved)/ml},0);
  return `<div class="card" style="margin-bottom:16px"><h3>🧠 قاعدة التوزيع الذكية <small style="color:var(--mut);font-weight:600">الدخل المعتمد: ${money(inc)}</small></h3>
    <div class="filters">${RULES.map((r,i)=>`<button class="fc ${state.settings.rule===i?'on':''}" data-act="rule" data-i="${i}">${r[0]} / ${r[1]} / ${r[2]}</button>`).join('')}</div>
    ${inc<=0?emptyBox('💡','سجل دخلك أو حدد "الدخل الشهري المتوقع" من الإعدادات عشان أبني لك الخطة.',''):rows.map(([ic,n,d,pct,act,c,lim])=>{const target=inc*pct/100,p=target>0?act/target*100:0,bad=lim?p>100:p<100;
      return `<div style="margin-bottom:18px"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px"><b>${ic} ${n} <small style="color:var(--mut);font-weight:500">${pct}% · ${d}</small></b>
      <span style="font-size:13px">${money(act)} / ${money(target)}</span></div><div class="prog" style="--c:${bad&&lim?'#ff5d7a':c}"><b style="width:${Math.min(100,p)}%"></b></div>
      <small style="color:var(--mut)">${lim?(p>100?`⚠️ تجاوزت الحد بـ ${money(act-target)}`:`✅ باقي لك ${money(target-act)}`):(p>=100?'🏆 حققت هدف الادخار!':`🎯 ادخر ${money(target-act)} إضافية للوصول للهدف`)}</small></div>`}).join('')}</div>
  <div class="grid g2">
    <div class="card"><h3>🔮 التوقعات</h3>
      <div class="kv"><span>متوسط الصرف اليومي</span><b>${money(f.daily)}</b></div>
      <div class="kv"><span>المتوقع صرفه بنهاية الشهر</span><b>${money(f.proj)}</b></div>
      <div class="kv"><span>الأيام المتبقية</span><b>${f.left}</b></div>
      <div class="kv"><span>المسموح صرفه يومياً</span><b style="color:var(--green)">${f.left>0?money(f.allow):'—'}</b></div>
      <div class="kv"><span>المتوقع يتبقى آخر الشهر</span><b style="color:${t.avail-(f.proj-t.expense)>=0?'var(--green)':'var(--red)'}">${money(t.avail-(f.proj-t.expense))}</b></div></div>
    <div class="card"><h3>🏆 خطة الأهداف</h3>
      ${state.goals.length?`<div class="kv"><span>مطلوب شهرياً لكل الأهداف</span><b>${money(goalNeed)}</b></div><div class="kv"><span>المقترح للادخار (${rule[2]}%)</span><b>${money(inc*rule[2]/100)}</b></div>
      <p style="margin-top:12px;color:var(--mut);font-size:14px">${goalNeed>inc*rule[2]/100?'⚠️ أهدافك تحتاج أكثر من نسبة الادخار المقترحة. مدّد المواعيد أو ارفع الدخل.':'✅ نسبة ادخارك المقترحة تكفي لتحقيق أهدافك في مواعيدها.'}</p>`:emptyBox('🎯','أضف أهدافاً لأحسب لك الخطة.','')}</div>
  </div>
  <div class="card"><h3>📅 آخر 6 أشهر <span style="font-size:12px;font-weight:600;color:var(--mut)"><span style="color:#2ee6a6">■</span> دخل &nbsp; <span style="color:#ff5d7a">■</span> مصروف</span></h3>
    <div class="bars" style="height:170px;gap:14px">${tr.map((x,i)=>`<div data-t="${mName(x.k)}: +${fmt(x.income)} / -${fmt(x.expense)}"><div class="pair"><i style="height:${x.income/mx*100}%;--k:${i*3};background:linear-gradient(180deg,#2ee6a6,#0fa97a)"></i><i style="height:${x.expense/mx*100}%;--k:${i*3+1};background:linear-gradient(180deg,#ff5d7a,#c23a56)"></i></div></div>`).join('')}</div>
    <div class="barlbl" style="gap:14px">${tr.map(x=>`<span style="flex:1;text-align:center">${MONTHS[+x.k.slice(5)-1]}</span>`).join('')}</div></div>`}

const ckb=(k,on)=>`<button class="ck ${on?'on':''}" data-act="pk" data-k="${k}" aria-label="تأشير">✓</button>`;

      <div class="kv"><span>المبلغ المعتمد للتوزيع</span><b style="color:var(--green)">${money(c.restUse)} ${c.hasActual?'':'(متوقع)'} ${rs!==100?`<span style="color:var(--red)">⚠️ النسب ${rs}%</span>`:''}</b></div>
      ${p.rest.map(r=>row('rest:'+r.id,pm.done['rest:'+r.id],kic(r.kind),kcol(r.kind),esc(r.name),r.pct+'% من الباقي',money(rest0*r.pct/100))).join('')}
      <label class="chk"><input type="checkbox" data-pdeduct ${p.deductDebt?'checked':''}>خصم قسط دين الوالدة (${money(d.inst)}) من الباقي</label></div>

function carryModal(id){const x=state.carry.find(y=>y.id===id)||{name:'',amount:''};modal(`<h3>${id?'✏️ تعديل':'➕ مبلغ راجع'}</h3><form data-form="carry" data-id="${id||''}"><label>الجهة<input name="name" value="${esc(x.name)}" placeholder="مثال: بنك الرياض"></label><label>المبلغ<input name="amount" inputmode="decimal" value="${x.amount}"></label><button class="btn pri wide">حفظ</button></form>`)}
function debtModal(){const d=state.debt;modal(`<h3>👩 تعديل الدين</h3><form data-form="debt"><label>الاسم<input name="name" value="${esc(d.name)}"></label><div class="row"><label>إجمالي الدين<input name="total" inputmode="decimal" value="${d.total||''}"></label><label>القسط الشهري<input name="inst" inputmode="decimal" value="${d.inst||''}"></label></div><label>تاريخ أول قسط<input type="date" name="start" value="${d.start}"></label><p style="font-size:13px">تغيير المبلغ أو القسط أو التاريخ يعيد بناء جدول الأقساط مع الحفاظ على المسدد.</p><button class="btn pri wide">حفظ</button></form>${d.total>0?`<button class="btn red wide" style="margin-top:8px" data-act="clear-debt">🗑️ حذف الدين</button>`:''}`)}
const VIEWS={dash:vDash,split:vSplit,tx:vTx,bud:vBud,goal:vGoal,inv:vInv,plan:vPlan,set:vSet};

/* ---------- الرسم العام ---------- */
function renderNav(){$('#nav').innerHTML=NAV.map(([k,i,l])=>`<button class="${view===k?'on':''}" data-act="nav" data-v="${k}"><span class="ni">${i}</span><span>${l}</span></button>`).join('')}
function renderTop(){
  const h=new Date().getHours(),g=h<5?'سهران؟ 🌙':h<12?'صباح الخير ☀️':h<17?'يعطيك العافية 🌤️':h<21?'مساء الخير 🌆':'ليلتك سعيدة 🌙';
  const keys=[...new Set([...Object.keys(state.months),cur])].sort().reverse();
  $('#topbar').innerHTML=`<div><h1>${TITLES[view]}</h1><p>${g}${state.settings.name?' يا '+esc(state.settings.name):''} 👋</p></div>
  <div class="tb-a"><span class="chip ${syncMode}" id="sync" data-act="nav" data-v="set" title="${esc(cloudMsg)}">${SYNC[syncMode]}</span>
  <div class="mnav"><button data-act="mprev" title="الشهر السابق">→</button><select data-change="month">${keys.map(k=>`<option value="${k}" ${k===cur?'selected':''}>${mName(k)}</option>`).join('')}</select><button data-act="mnext" title="الشهر التالي">←</button></div>
  <button class="btn" data-act="new-month">🔄<span class="hm"> شهر جديد</span></button><button class="btn ic" data-act="theme" title="الوضع">🌓</button></div>`}
function animateCounts(still){$$('[data-count]').forEach(el=>{const to=+el.dataset.count||0;if(still){el.textContent=fmt(to);return}const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/950),e=1-Math.pow(1-p,4);el.textContent=fmt(to*e);if(p<1)requestAnimationFrame(f)})(t0)})}
function render(still){
  document.documentElement.dataset.theme=state.settings.theme;
  const tc=document.querySelector('meta[name=theme-color]');if(tc)tc.content=state.settings.theme==='light'?'#eef1ff':'#080b1a';
  getM(cur);renderNav();renderTop();
  const old=$('#view .scroll'),sc=old?old.scrollTop:0;
  $('#view').classList.toggle('still',!!still);
  $('#view').innerHTML=VIEWS[view]();
  const nw=$('#view .scroll');if(nw)nw.scrollTop=sc;
  $$('#view > *').forEach((el,i)=>el.style.setProperty('--i',i));
  animateCounts(still)}

/* ---------- النوافذ ---------- */
function modal(html){closeModal(true);const el=document.createElement('div');el.className='ov';el.innerHTML=`<div class="md"><button class="x" data-act="close">✕</button>${html}</div>`;
  document.body.appendChild(el);requestAnimationFrame(()=>el.classList.add('show'));const f=$('input:not([type=checkbox]):not([type=hidden]),select',el);setTimeout(()=>f&&f.focus(),300)}
function closeModal(now){$$('.ov').forEach(o=>{if(now)o.remove();else{o.classList.remove('show');setTimeout(()=>o.remove(),280)}})}
function toast(msg,undo){const el=document.createElement('div');el.className='toast';el.innerHTML=`<span>${msg}</span>`+(undo?`<button>${undo.label}</button>`:'');
  if(undo)el.querySelector('button').onclick=()=>{undo.fn();el.remove()};$('#toasts').appendChild(el);setTimeout(()=>el.classList.add('out'),undo?5000:2600);setTimeout(()=>el.remove(),undo?5400:3000)}
function ask(title,text,ok,fn){pending=fn;modal(`<h3>${title}</h3><p>${text}</p><div class="row"><button class="btn red" data-act="ask-ok">${ok}</button><button class="btn" data-act="close">إلغاء</button></div>`)}
const shakeModal=()=>{const m=$('.md');if(m){m.classList.remove('shake');void m.offsetWidth;m.classList.add('shake')}};
const defDate=()=>cur===mk(todayISO())?todayISO():cur+'-01';

function chipsHTML(){return CATS[draft.type].map(([c,i])=>`<button type="button" class="chp ${draft.cat===c?'on':''}" data-act="pick-cat" data-c="${esc(c)}">${i} ${c}</button>`).join('')}
function txModal(id,preType,asRec){
  const ex=id?peek(cur).tx.find(x=>x.id===id):null;
  draft={type:ex?ex.type:(preType||'expense'),cat:ex?ex.cat:null,rec:!!asRec};
  modal(`<h3>${ex?'✏️ تعديل معاملة':asRec?'🔁 التزام ثابت جديد':'✨ معاملة جديدة'}</h3>
  <form data-form="tx" data-id="${id||''}">
    <div class="seg-types">${Object.entries(TYPES).map(([k,v])=>`<button type="button" class="st ${k===draft.type?'on':''}" data-act="pick-type" data-k="${k}" style="--c:${v.color}">${v.icon}<span>${v.label}</span></button>`).join('')}</div>
    <label class="big"><input name="amount" inputmode="decimal" placeholder="0" autocomplete="off" value="${ex?ex.amount:''}"><span>${state.settings.currency}</span></label>
    <div class="lbl">التصنيف</div><div class="chips" id="catChips">${chipsHTML()}</div>
    <div class="row" style="margin-top:14px"><label>${asRec?'يوم الشهر':'التاريخ'}<input type="date" name="date" min="${cur}-01" max="${cur}-${daysIn(cur)}" value="${ex?ex.date:defDate()}"></label><label>ملاحظة<input name="note" placeholder="اختياري" value="${esc(ex?.note||'')}"></label></div>
    ${ex||asRec?'':'<label class="chk"><input type="checkbox" name="rec">🔁 كرّر هذه المعاملة كل شهر تلقائياً</label>'}
    <button class="btn pri wide">${ex?'حفظ التعديلات':'حفظ ✓'}</button></form>`)}

/* ---------- الإجراءات ---------- */
function addTx(f,id){
  const amount=num(f.amount.value);if(amount<=0){shakeModal();f.amount.focus();return toast('اكتب مبلغاً صحيحاً 🙂')}
  const cat=draft.cat||CATS[draft.type][0][0];const x={id:id||uid(),type:draft.type,cat,amount,date:f.date.value||defDate(),note:f.note.value.trim(),ts:Date.now()};
  const m=getM(cur);
  if(id){const i=m.tx.findIndex(y=>y.id===id);if(i>-1){x.ts=m.tx[i].ts;x.goalId=m.tx[i].goalId;x.planKey=m.tx[i].planKey;m.tx[i]=x}}else m.tx.push(x);
  if(draft.rec||(f.rec&&f.rec.checked))state.recurring.push({id:uid(),type:x.type,cat:x.cat,amount:x.amount,note:x.note,day:+x.date.slice(8)});
  if(draft.rec&&!id){const i=m.tx.findIndex(y=>y.id===x.id);if(i>-1&&!(f.rec&&f.rec.checked)){m.tx.splice(i,1)}}
  save();closeModal();render();
  toast(draft.rec?'تم إضافة الالتزام الثابت 🔁':id?'تم التعديل ✅':`${TYPES[x.type].icon} تمت إضافة ${money(amount)}`);
  if(x.type==='expense'){const lim=state.budgets[x.cat],sp=Object.fromEntries(byCat(cur))[x.cat]||0;if(lim>0&&sp>lim)setTimeout(()=>toast(`⚠️ تجاوزت ميزانية "${x.cat}"!`),700);else if(lim>0&&sp>lim*.85)setTimeout(()=>toast(`🔔 وصلت 85% من ميزانية "${x.cat}"`),700)}}

function budgetModal(c){modal(`<h3>🎯 ميزانية ${catIcon('expense',c)} ${esc(c)}</h3><p>أقصى مبلغ تبغى تصرفه على هذا التصنيف شهرياً. اتركه 0 للإلغاء.</p>
  <form data-form="budget" data-c="${esc(c)}"><label class="big"><input name="v" inputmode="decimal" value="${state.budgets[c]||''}" placeholder="0"><span>${state.settings.currency}</span></label><button class="btn pri wide">حفظ</button></form>`)}
const EMO=['🎯','🚗','🏠','✈️','💍','🎓','💻','🛟','🏖️','📱','👶','🕋'];
function goalModal(id){const g=state.goals.find(x=>x.id===id)||{emoji:'🎯',name:'',target:'',saved:'',deadline:''};
  modal(`<h3>${id?'✏️ تعديل الهدف':'🏆 هدف جديد'}</h3><form data-form="goal" data-id="${id||''}">
  <label>الأيقونة<select name="emoji">${EMO.map(e=>`<option ${g.emoji===e?'selected':''}>${e}</option>`).join('')}</select></label>
  <label>اسم الهدف<input name="name" value="${esc(g.name)}" placeholder="مثال: سيارة جديدة"></label>
  <div class="row"><label>المبلغ المستهدف<input name="target" inputmode="decimal" value="${g.target}"></label><label>المدخر حالياً<input name="saved" inputmode="decimal" value="${g.saved}" placeholder="0"></label></div>
  <label>الموعد المستهدف (اختياري)<input type="date" name="deadline" value="${g.deadline||''}"></label><button class="btn pri wide">حفظ</button></form>`)}
function invModal(id){const x=state.investments.find(y=>y.id===id)||{name:'',type:'أسهم',invested:'',value:''};
  modal(`<h3>${id?'✏️ تعديل الاستثمار':'📈 استثمار جديد'}</h3><form data-form="inv" data-id="${id||''}">
  <label>الاسم<input name="name" value="${esc(x.name)}" placeholder="مثال: أسهم أرامكو"></label>
  <label>النوع<select name="type">${CATS.invest.map(([c,i])=>`<option ${x.type===c?'selected':''}>${c}</option>`).join('')}</select></label>
  <div class="row"><label>المبلغ المستثمر<input name="invested" inputmode="decimal" value="${x.invested}"></label><label>القيمة الحالية<input name="value" inputmode="decimal" value="${x.value}"></label></div>
  ${id?'':'<label class="chk"><input type="checkbox" name="logtx" checked>سجّلها كمعاملة استثمار في هذا الشهر</label>'}<button class="btn pri wide">حفظ</button></form>`)}

function newMonthModal(){
  const latest=Object.keys(state.months).sort().pop()||cur,real=mk(todayISO()),target=latest<real?real:nextKey(latest),t=totals(latest);
  modal(`<h3>🔄 بدء ${mName(target)}</h3><p>سيتم حفظ <b>${mName(latest)}</b> في الأرشيف (تقدر ترجع له من قائمة الأشهر)، وتبدأ شهر جديد نظيف.</p>
  <div class="tip"><span>💎</span><span>الرصيد المتبقي من ${mName(latest)}: <b>${money(t.avail)}</b></span></div>
  <label class="chk"><input type="checkbox" id="carry" checked>ترحيل الرصيد المتبقي للشهر الجديد</label>
  <label class="chk"><input type="checkbox" id="addrec" checked>إضافة الالتزامات الثابتة (${state.recurring.length})</label>
  <button class="btn pri wide" data-act="do-newmonth" data-t="${target}" data-l="${latest}">ابدأ الشهر الجديد 🚀</button>`)}

function exportFile(name,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

/* ---------- الأحداث ---------- */
document.addEventListener('click',e=>{
  const ov=e.target;if(ov.classList&&ov.classList.contains('ov')&&ov===e.target){closeModal();return}
  const b=e.target.closest('.btn');if(b){const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height),sp=document.createElement('span');sp.className='rp';sp.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;b.appendChild(sp);setTimeout(()=>sp.remove(),600)}
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,d=el.dataset;
  const m=getM(cur);
  switch(a){
    case 'nav':view=d.v;flt={type:'all',q:'',cat:''};render();scrollTo({top:0,behavior:'smooth'});break;
    case 'close':closeModal();break;
    case 'add-tx':txModal();break;
    case 'add-rec':txModal(null,'expense',true);break;
    case 'edit-tx':txModal(d.id);break;
    case 'del-tx':{const i=m.tx.findIndex(x=>x.id===d.id);if(i<0)break;const[x]=m.tx.splice(i,1);planUnmark(x,false);save();render();toast('تم حذف المعاملة 🗑️',{label:'تراجع',fn:()=>{getM(cur).tx.splice(i,0,x);planUnmark(x,true);save();render()}});break}
    case 'pick-type':draft.type=d.k;draft.cat=null;$$('.st').forEach(s=>s.classList.toggle('on',s.dataset.k===d.k));$('#catChips').innerHTML=chipsHTML();break;
    case 'pick-cat':draft.cat=d.c;$$('.chp').forEach(s=>s.classList.toggle('on',s.dataset.c===d.c));break;
    case 'filt':flt.type=d.t;render();break;
    case 'mprev':case 'mnext':{const ks=[...new Set([...Object.keys(state.months),cur])].sort(),i=ks.indexOf(cur),n=ks[i+(a==='mprev'?-1:1)];if(n){cur=n;render()}else toast(a==='mprev'?'ما فيه أشهر أقدم':'هذا آخر شهر — استخدم "شهر جديد"');break}
    case 'new-month':newMonthModal();break;
    case 'do-newmonth':{const t=d.t,l=d.l,carry=$('#carry').checked,addrec=$('#addrec').checked;
      if(state.months[t]){cur=t;closeModal();render();return toast('هذا الشهر موجود مسبقاً')}
      const av=totals(l).avail;state.months[t]={opening:carry?av:0,tx:[]};
      if(addrec)state.recurring.forEach(r=>state.months[t].tx.push({id:uid(),type:r.type,cat:r.cat,amount:r.amount,note:r.note,date:`${t}-${pad(Math.min(r.day,daysIn(t)))}`,ts:Date.now(),rec:1}));
      cur=t;view='dash';save();closeModal();render();confetti();toast(`🚀 بدأ ${mName(t)} — بالتوفيق!`);break}
    case 'theme':state.settings.theme=state.settings.theme==='dark'?'light':'dark';save();render();break;
    case 'edit-budget':budgetModal(d.c);break;
    case 'del-rec':state.recurring=state.recurring.filter(x=>x.id!==d.id);save();render();toast('تم حذف الالتزام');break;
    case 'add-goal':goalModal();break;case 'edit-goal':goalModal(d.id);break;
    case 'del-goal':ask('حذف الهدف؟','سيتم حذف الهدف نهائياً.','حذف',()=>{state.goals=state.goals.filter(x=>x.id!==d.id);save();render()});break;
    case 'fund-goal':{const g=state.goals.find(x=>x.id===d.id);modal(`<h3>${g.emoji} إضافة مبلغ إلى "${esc(g.name)}"</h3><p>باقي لك ${money(Math.max(0,g.target-g.saved))} للوصول للهدف.</p><form data-form="fund" data-id="${g.id}"><label class="big"><input name="a" inputmode="decimal" placeholder="0"><span>${state.settings.currency}</span></label><button class="btn pri wide">إضافة (تسجل كادخار)</button></form>`);break}
    case 'add-inv':invModal();break;case 'edit-inv':invModal(d.id);break;
    case 'del-inv':ask('حذف الاستثمار؟','سيتم حذفه من محفظتك.','حذف',()=>{state.investments=state.investments.filter(x=>x.id!==d.id);save();render()});break;
    case 'upd-inv':{const x=state.investments.find(y=>y.id===d.id);modal(`<h3>🔄 تحديث قيمة ${esc(x.name)}</h3><form data-form="invval" data-id="${x.id}"><label class="big"><input name="v" inputmode="decimal" value="${x.value}"><span>${state.settings.currency}</span></label><button class="btn pri wide">تحديث</button></form>`);break}
    case 'rule':state.settings.rule=+d.i;save();render();break;
    case 'export-json':exportFile(`flousi-${todayISO()}.json`,JSON.stringify(state,null,2),'application/json');toast('تم تنزيل النسخة الاحتياطية 💾');break;
    case 'export-csv':{let c='\uFEFFالشهر,التاريخ,النوع,التصنيف,المبلغ,ملاحظة\n';Object.keys(state.months).sort().forEach(k=>state.months[k].tx.forEach(x=>c+=`${k},${x.date},${TYPES[x.type].label},${x.cat},${x.amount},"${(x.note||'').replace(/"/g,'""')}"\n`));exportFile(`flousi-${todayISO()}.csv`,c,'text/csv');toast('تم تصدير الملف 📊');break}
    case 'import-json':$('#imp').click();break;
    case 'reset-all':ask('⚠️ مسح كل البيانات؟','سيتم حذف كل المعاملات والأهداف والاستثمارات. (يُنصح بعمل نسخة احتياطية أولاً)','نعم، امسح كل شيء',()=>{const s=state.settings;state=def();state.settings={...s};cur=mk(todayISO());getM(cur);save();view='dash';render();toast('تم المسح')});break;
    case 'ask-ok':{const f=pending;pending=null;closeModal();f&&f();break}
    case 'resync':if(uidNow&&FB){setSync('busy');startSync();pushCloud(true)}break;
    case 'logout':ask('تسجيل الخروج؟','سيتم تسجيل خروجك ومسح نسخة هذا الجهاز — بياناتك محفوظة في حسابك وترجع لك عند الدخول.','خروج',doLogout);break;
    case 'del-account':ask('⚠️ حذف الحساب نهائياً؟','سيتم حذف حسابك وكل بياناتك المالية بشكل لا رجعة فيه.','احذف حسابي',delAccount);break;
    case 'clear-debt':state.debt={name:'دين',total:0,inst:0,start:todayISO(),pay:[]};save();closeModal();render(true);toast('تم حذف الدين');break;
    case 'atab':setAmode(d.m);break;
    case 'forgot':forgotPw();break;
    case 'auth-google':googleLogin();break;
    case 'auth-retry':initAuth();break;
    case 'eye':{const i=el.parentElement.querySelector('input');i.type=i.type==='password'?'text':'password';break}
    case 'pk':togglePlan(d.k);break;
    case 'edit-salary':modal(`<h3>💼 الراتب الإجمالي</h3><form data-form="salary"><label class="big"><input name="v" inputmode="decimal" value="${state.plan.salary}"><span>${state.settings.currency}</span></label><button class="btn pri wide">حفظ</button></form>`);break;
    case 'add-alloc':allocModal();break;case 'edit-alloc':allocModal(d.id);break;
    case 'del-alloc':ask('حذف التحويل؟','سيُحذف من تقسيمتك (المعاملات المسجلة تبقى).','حذف',()=>{state.plan.allocs=state.plan.allocs.filter(x=>x.id!==d.id);save();render(true)});break;
    case 'add-sub':subModal();break;case 'edit-sub':subModal(d.id);break;
    case 'del-sub':ask('حذف الاشتراك؟','سيُحذف من قائمة الاشتراكات.','حذف',()=>{state.plan.subs=state.plan.subs.filter(x=>x.id!==d.id);save();render(true)});break;
    case 'edit-pcts':pctModal(d.w);break;
    case 'add-carry':carryModal();break;case 'edit-carry':carryModal(d.id);break;
    case 'del-carry':state.carry=state.carry.filter(x=>x.id!==d.id);save();render(true);toast('تم الحذف');break;
    case 'carry-back':{const x=state.carry.find(y=>y.id===d.id);if(!x)break;getM(cur).tx.push({id:uid(),type:'income',cat:'استرداد',amount:x.amount,date:defDate(),note:x.name,ts:Date.now()});state.carry=state.carry.filter(y=>y.id!==d.id);save();render(true);toast('↩️ تم تسجيل المبلغ الراجع كدخل');break}
    case 'edit-debt':debtModal();break;
    case 'onb-go':break;
  }
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();const k=f.dataset.form,id=f.dataset.id;
  if(k==='auth')return doAuth(f);
  if(k==='tx')return addTx(f,id||null);
  if(k==='budget'){const v=num(f.v.value);if(v>0)state.budgets[f.dataset.c]=v;else delete state.budgets[f.dataset.c];save();closeModal();render();toast('تم حفظ الميزانية 🎯')}
  if(k==='goal'){const n=f.name.value.trim(),t=num(f.target.value);if(!n||t<=0){shakeModal();return toast('اكتب الاسم والمبلغ المستهدف')}
    const o={emoji:f.emoji.value,name:n,target:t,saved:num(f.saved.value),deadline:f.deadline.value};
    if(id){Object.assign(state.goals.find(x=>x.id===id),o)}else state.goals.push({id:uid(),...o});save();closeModal();render();toast('تم حفظ الهدف 🏆')}
  if(k==='fund'){const a=num(f.a.value);if(a<=0){shakeModal();return}const g=state.goals.find(x=>x.id===id),was=g.saved;g.saved+=a;
    getM(cur).tx.push({id:uid(),type:'saving',cat:'هدف',amount:a,date:defDate(),note:g.name,ts:Date.now(),goalId:g.id});save();closeModal();render();
    if(was<g.target&&g.saved>=g.target){confetti();toast('🎉 مبروك! حققت هدف "'+esc(g.name)+'"')}else toast('تمت الإضافة 💪')}
  if(k==='inv'){const n=f.name.value.trim(),iv=num(f.invested.value);if(!n||iv<=0){shakeModal();return toast('اكتب الاسم والمبلغ')}
    const o={name:n,type:f.type.value,invested:iv,value:num(f.value.value)||iv};

(function bg(){

  const orbs=[{c:'139,108,255',x:.2,y:.2,r:.42,s:.00022,a:.32},{c:'34,211,238',x:.85,y:.3,r:.36,s:.00028,a:.22},{c:'46,230,166',x:.6,y:.9,r:.4,s:.00019,a:.2},{c:'255,93,122',x:.1,y:.85,r:.3,s:.00025,a:.16}];
  let coins=[];
  function size(){D=Math.min(innerWidth<700?1.5:2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;x.setTransform(D,0,0,D,0,0);
    const n=Math.round(Math.min(46,W*H/32000));coins=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,r:5+Math.random()*13,vy:-(.12+Math.random()*.4),ph:Math.random()*6.28,sw:.3+Math.random()*.7,rot:Math.random()*6.28,g:Math.random()>.35}))}
  addEventListener('resize',size);size();
  addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
  addEventListener('touchmove',e=>{const t=e.touches[0];mouse.x=t.clientX;mouse.y=t.clientY},{passive:true});
  addEventListener('mouseout',()=>{mouse.x=mouse.y=-999});
  function draw(t){
    const light=document.documentElement.dataset.theme==='light',k=light?.55:1;
    x.clearRect(0,0,W,H);
    mouse.px+=((mouse.x>0?mouse.x/W-.5:0)-mouse.px)*.04;mouse.py+=((mouse.y>0?mouse.y/H-.5:0)-mouse.py)*.04;
    orbs.forEach((o,i)=>{const cx=(o.x+Math.sin(t*o.s+i*2)*.12-mouse.px*.06*(i+1))*W,cy=(o.y+Math.cos(t*o.s*1.3+i)*.12-mouse.py*.06*(i+1))*H,r=o.r*Math.max(W,H)*(1+Math.sin(t*o.s*2+i)*.08);
      const g=x.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,`rgba(${o.c},${o.a*k})`);g.addColorStop(1,`rgba(${o.c},0)`);x.fillStyle=g;x.fillRect(0,0,W,H)});
    coins.forEach(c=>{c.y+=c.vy;c.ph+=.012*c.sw;c.rot+=.01;let px=c.x+Math.sin(c.ph)*26;
      const dx=px-mouse.x,dy=c.y-mouse.y,d=Math.hypot(dx,dy);if(d<140){const f=(140-d)/140;c.x+=dx/d*f*3.2;c.y+=dy/d*f*3.2;px=c.x+Math.sin(c.ph)*26}
      if(c.y<-30){c.y=H+30;c.x=Math.random()*W}if(c.x<-40)c.x=W+30;if(c.x>W+40)c.x=-30;
      const sq=Math.abs(Math.cos(c.rot));x.save();x.translate(px,c.y);x.scale(Math.max(.18,sq),1);
      const g=x.createRadialGradient(-c.r*.3,-c.r*.3,1,0,0,c.r);
      if(c.g){g.addColorStop(0,`rgba(255,235,160,${.55*k})`);g.addColorStop(1,`rgba(255,184,40,${.28*k})`)}else{g.addColorStop(0,`rgba(190,170,255,${.5*k})`);g.addColorStop(1,`rgba(100,80,230,${.22*k})`)}
      x.beginPath();x.arc(0,0,c.r,0,6.283);x.fillStyle=g;x.fill();x.lineWidth=1.2;x.strokeStyle=c.g?`rgba(255,215,100,${.5*k})`:`rgba(170,150,255,${.45*k})`;x.stroke();
      x.beginPath();x.arc(0,0,c.r*.62,0,6.283);x.stroke();x.restore()});
    if(mouse.x>0){const g=x.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,170);g.addColorStop(0,`rgba(139,108,255,${.16*k})`);g.addColorStop(1,'rgba(139,108,255,0)');x.fillStyle=g;x.fillRect(mouse.x-170,mouse.y-170,340,340)}
    if(!matchMedia('(prefers-reduced-motion:reduce)').matches)requestAnimationFrame(draw)}
  requestAnimationFrame(draw)})();

function confetti(){const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=['#8b6cff','#22d3ee','#2ee6a6','#ffc857','#ff5d7a','#ff9f5a'];
  const ps=Array.from({length:150},()=>({x:innerWidth/2+(Math.random()-.5)*160,y:innerHeight*.62,vx:(Math.random()-.5)*18,vy:-Math.random()*17-5,s:Math.random()*8+4,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.random()*6|0]}));let n=0;

async function loadFirebase(){
  if(FB)return FB;
  const base='https://www.gstatic.com/firebasejs/10.12.2/';
  const [A,Au,F]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
  const app=A.getApps().length?A.getApp():A.initializeApp(firebaseConfig),auth=Au.getAuth(app);
  let db;try{db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}catch(e){db=F.getFirestore(app)}
  FB={Au,F,auth,db};return FB}

function startSync(){
  const {F,db}=FB;if(!uidNow)return;if(unsub){unsub();unsub=null}
  let first=true;const me=uidNow;
  unsub=F.onSnapshot(F.doc(db,'users',me),snap=>{
    if(uidNow!==me||deleting)return;
    try{
      if(!snap.exists()){if(snap.metadata.fromCache)return;pushCloud(true)}
      else{const r=JSON.parse(snap.data().json),ru=r.updatedAt||0,lu=state.updatedAt||0;
        if(ru>lu){state=migrate(r);persist();getM(cur);render(true);toast(first?'☁️ تمت مزامنة بياناتك':'☁️ وصلك تحديث من جهاز آخر')}
        else if(first&&ru<lu)pushCloud(true)}
      setSync('cloud',cloudUser.email);
      if(first){first=false;if(!state.settings.onboarded)setTimeout(onboarding,350)}
    }catch(e){console.warn(e)}
  },err=>{console.warn(err);setSync('err',explain(err))})}
async function pushCloud(force){
  if(!FB||!uidNow||deleting||(!dirty&&!force))return;
  try{dirty=false;const {F,db}=FB,ts=state.updatedAt||(state.updatedAt=Date.now());
    await F.setDoc(F.doc(db,'users',uidNow),{json:JSON.stringify(state),updatedAt:ts});setSync('cloud',cloudUser.email)}
  catch(e){dirty=true;console.warn(e);setSync('err',explain(e));clearTimeout(retryT);retryT=setTimeout(()=>pushCloud(true),15000)}}
async function doLogout(){
  try{if(dirty)await pushCloud(true);if(unsub){unsub();unsub=null}const {Au,F,auth,db}=FB;
    try{localStorage.removeItem(keyFor(uidNow))}catch(e){}
    try{await F.terminate(db);await F.clearIndexedDbPersistence(db)}catch(e){}
    await Au.signOut(auth);location.reload()}catch(e){toast(explain(e))}}
async function delAccount(){
  deleting=true;

  catch(e){deleting=false;dirty=true;pushCloud(true);toast(e.code==='auth/requires-recent-login'?'لأسباب أمنية: سجّل خروج ثم ادخل من جديد وحاول مرة ثانية':explain(e))}}

    <div class="tip"><span>🔒</span><span>بياناتك خاصة بحسابك وحدك — لا أحد يقدر يشوفها غيرك.</span></div>

    <button class="btn" data-act="del-account" style="opacity:.7">🗑️ حذف حسابي وبياناتي نهائياً</button></div></div>`}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&FB&&dirty){clearTimeout(pushT);pushCloud()}});
addEventListener('pagehide',()=>{if(FB&&dirty)pushCloud()});
addEventListener('online',()=>{if(FB&&uidNow)pushCloud(true)});

/* ---------- ترحيب أول مرة ---------- */
function onboarding(){modal(`<h3>👋 أهلاً بك في فلوسي</h3><p>خلنا نبدأ بثلاث معلومات سريعة، وتقدر تغيّرها بعدين.</p>
  <form data-form="onb"><label>وش اسمك؟<input name="name" placeholder="مثال: خالد" value="${esc(state.settings.name)}"></label>
  <label>دخلك الشهري المتوقع<input name="inc" inputmode="decimal" placeholder="0" value="${state.settings.expectedIncome||''}"></label>
  <label>رصيدك الحالي (اللي معك الحين)<input name="bal" inputmode="decimal" placeholder="0"></label>
  <button class="btn pri wide">يلا نبدأ 🚀</button></form>`)}

/* ---------- تشغيل ---------- */
initAuth();
})();
